<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Alert</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); padding: 30px; border-radius: 10px 10px 0 0; text-align: center;">
        <h1 style="color: white; margin: 0; font-size: 28px;">📦 Inventory Alert</h1>
    </div>

    <div style="background: #f9f9f9; padding: 30px; border-radius: 0 0 10px 10px;">
        <p style="font-size: 18px; margin-top: 0;">Hi {{ user_name }},</p>

        <div style="background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #f7971e; margin: 20px 0;">
            <p style="font-size: 16px; margin: 0; color: #555;">{{ message }}</p>
        </div>

        {% if item_count %}
        <p style="color: #555; text-align: center; font-size: 15px;">
            <strong>{{ item_count }}</strong> item{{ 's' if item_count != 1 else '' }} affected
        </p>
        {% endif %}

        <div style="text-align: center; margin: 30px 0;">
            <a href="https://app.nutrilens.com/dashboard/inventory"
               style="display: inline-block; background-color: #f7971e; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-weight: bold;">
                View Inventory
            </a>
        </div>

        <p style="font-size: 14px; color: #666; margin-top: 30px;">
            The NutriLens Team
        </p>
    </div>

    <div style="text-align: center; padding: 20px; font-size: 12px; color: #999;">
        <p>You're receiving this because you have inventory notifications enabled.</p>
        <p>
            <a href="{{ unsubscribe_url }}" style="color: #f7971e; text-decoration: none;">Manage notification preferences</a>
        </p>
    </div>
</body>
</html>
